<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>沉浸式捡手机 - 请选择</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #1a1a1a; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { 
    color: #fff; 
    font-size: 24px; 
    margin-bottom: 40px; 
    letter-spacing: 2px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  a { 
    display: block; 
    width: 260px; 
    padding: 16px; 
    text-align: center; 
    background: #07c160; 
    color: #fff; 
    text-decoration: none; 
    border-radius: 12px; 
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(7, 193, 96, 0.3);
    transition: all 0.2s ease;
  }
  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(7, 193, 96, 0.5);
    opacity: 0.9;
  }
  a.fang { 
    background: #3498db; 
    box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
  }
  a.fang:hover {
    box-shadow: 0 6px 20px rgba(52, 152, 219, 0.5);
  }

</head>
