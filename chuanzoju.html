<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>黄沐之女的微信</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .phone { width: 375px; height: 812px; background: #ededed; border-radius: 45px; border: 10px solid #2c2c2e; position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 30px; background: #000; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 1000; }
  .status-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 25px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #000; z-index: 999; }
  .wechat-app { width: 100%; height: 100%; display: flex; flex-direction: column; position: absolute; top: 0; left: 0; }
  .nav-header { padding: 50px 15px 15px; background: #ededed; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 17px; position: relative; }
  .nav-header .back-btn { position: absolute; left: 15px; bottom: 15px; cursor: pointer; color: #000; font-size: 16px; display: flex; align-items: center; }
  .nav-header .back-btn::before { content: "‹"; font-size: 28px; margin-right: 2px; line-height: 1; }
  .main-content { flex: 1; overflow-y: auto; position: relative; }
  .tab-view { display: none; height: 100%; overflow-y: auto; padding-bottom: 60px; }
  .tab-view.active { display: block; }
  .chat-item { display: flex; align-items: center; padding: 12px 15px; background: #ededed; border-bottom: 1px solid #e0e0e0; cursor: pointer; }
  .chat-item:active { background: #ddd; }
  .chat-avatar { width: 48px; height: 48px; border-radius: 6px; background: #ccc; margin-right: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 18px; font-weight: bold; flex-shrink: 0; position: relative; overflow: hidden; }
  .chat-avatar img { width: 100%; height: 100%; border-radius: 6px; object-fit: cover; }
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-size: 16px; color: #000; margin-bottom: 4px; font-weight: 500; }
  .chat-msg { color: #888; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chat-time { font-size: 12px; color: #aaa; }
  .chat-badge { background: #ff3b30; color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; justify-content: center; align-items: center; padding: 0 4px; }
  .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #888; font-size: 10px; flex: 1; padding: 5px 0; position: relative; }
  .nav-item.active { color: #07c160; }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }
  .nav-badge { position: absolute; top: 0; right: 10px; background: #ff3b30; color: #fff; font-size: 10px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; justify-content: center; align-items: center; padding: 0 4px; }
  .chat-detail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ededed; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 200; }
  .chat-detail.active { transform: translateX(0); }
  .msg-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg-row { display: flex; align-items: flex-start; }
  .msg-row.left { justify-content: flex-start; }
  .msg-row.right { justify-content: flex-end; }
  .msg-avatar { width: 40px; height: 40px; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: #ccc; }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-row.left .msg-avatar { margin-right: 10px; }
  .msg-row.right .msg-avatar { margin-left: 10px; }
  .msg { max-width: calc(100% - 100px); padding: 10px 15px; border-radius: 6px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
  .msg.left { background: #fff; }
  .msg.left::before { content: ""; position: absolute; left: -6px; top: 12px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #fff; }
  .msg.right { background: #95ec69; }
  .msg.right::after { content: ""; position: absolute; right: -6px; top: 12px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 6px solid #95ec69; }
  .msg-time { text-align: center; font-size: 12px; color: #b2b2b2; margin: 15px 0; width: 100%; display: block; }
  .chat-input-area { flex-shrink: 0; padding: 10px 15px; background: #f7f7f7; border-top: 1px solid #ddd; }
  .chat-input-area input { width: 100%; padding: 10px 15px; border-radius: 6px; border: 1px solid #ddd; outline: none; font-size: 15px; }
  .moments-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 300; }
  .moments-view.active { transform: translateX(0); }
  .moments-header { position: relative; height: 250px; background: linear-gradient(135deg, #667eea, #764ba2); }
  .moments-header .back-btn { position: absolute; top: 55px; left: 15px; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; z-index: 10; }
  .moments-header .back-btn::before { content: "‹"; font-size: 28px; margin-right: 2px; line-height: 1; }
  .moments-header .user-info { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; color: #fff; }
  .moments-header .user-info img { width: 60px; height: 60px; border-radius: 6px; border: 2px solid #fff; margin-left: 10px; object-fit: cover; background: #ccc; }
  .moments-body { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
  .moment-item { display: flex; margin-bottom: 25px; }
  .moment-avatar { width: 40px; height: 40px; border-radius: 4px; background: #07c160; margin-right: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; flex-shrink: 0; overflow: hidden; }
  .moment-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .moment-content { flex: 1; }
  .moment-name { color: #576b95; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .moment-text { font-size: 15px; color: #000; margin-bottom: 8px; line-height: 1.4; }
  .moment-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; }
  .moment-like-btn { cursor: pointer; color: #576b95; }
  .moments-interaction { background: #f7f7f7; border-radius: 4px; padding: 8px 10px; margin-top: 8px; font-size: 13px; position: relative; }
  .like-list { color: #576b95; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .like-list .icon { color: #576b95; margin-right: 4px; font-size: 14px; }
  .like-list .name { color: #576b95; font-weight: 600; }
  .like-list .liked-me { color: #576b95; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar"><span>13:33</span><span>📶 🔋</span></div>
  <div class="wechat-app">
    <div class="nav-header" id="mainHeader">微信</div>
    <div class="main-content">
      <div class="tab-view active" id="tab-chats">
        
        <div class="chat-item" onclick="openChat('天使母亲')">
          <div class="chat-avatar"><img src="images/mucheng.png" alt="天使母亲"></div>
          <div class="chat-info">
            <div class="chat-name">天使母亲</div>
            <div class="chat-msg">111</div>
          </div>
          <div class="chat-meta"><div class="chat-time">刚刚</div></div>
        </div>
      </div>
      <div class="tab-view" id="tab-contacts">
        
        <div class="contact-item"><div class="contact-avatar"><img src="images/mucheng.png" alt="天使母亲"></div> 天使母亲</div>
      </div>
      <div class="tab-view" id="tab-discover">
        <div class="discover-item" onclick="openMoments()">
          <div class="discover-icon">📷</div>
          <div class="discover-text">朋友圈</div>
        </div>
      </div>
      <div class="tab-view" id="tab-me">
        <div style="padding: 30px; text-align: center; background: #fff;">
          <div style="width: 70px; height: 70px; border-radius: 8px; margin: 0 auto 10px; display: flex; justify-content: center; align-items: center; overflow: hidden;">
            <img src="images/dai.png" alt="黄沐之女" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div style="font-weight: bold; font-size: 18px;">黄沐之女</div>
        </div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-chats', '微信')"><span class="nav-icon">💬</span>微信</div>
      <div class="nav-item" onclick="switchTab('tab-contacts', '通讯录')"><span class="nav-icon">👥</span>通讯录</div>
      <div class="nav-item" onclick="switchTab('tab-discover', '发现')"><span class="nav-icon">🧭</span>发现</div>
      <div class="nav-item" onclick="switchTab('tab-me', '我')"><span class="nav-icon">👤</span>我</div>
    </div>
    <div class="chat-detail" id="chatDetail">
      <div class="nav-header"><div class="back-btn" onclick="closeChat()">返回</div><span id="chatTitle">聊天</span></div>
      <div class="msg-area" id="msgArea"></div>
      <div class="chat-input-area"><input type="text" placeholder="输入消息..."></div>
    </div>
    <div class="moments-view" id="momentsView">
      <div class="moments-header">
        <div class="back-btn" onclick="closeMoments()">返回</div>
        <div class="user-info"><span>黄沐之女</span><img src="images/dai.png" alt="头像"></div>
      </div>
      <div class="moments-body">
        
        <div class="moment-item">
          <div class="moment-avatar"><img src="images/dai.png" alt="黄沐之女"></div>
          <div class="moment-content">
            <div class="moment-name">黄沐之女</div>
            <div class="moment-text">我的法克</div>
            <div class="moment-footer">
              <span>刚刚</span>
              <span class="moment-like-btn" onclick="toggleLike(this, 'like-list-1792073991742.3096')">❤️ 赞</span>
            </div>
            <div class="moments-interaction">
              <div class="like-list" id="like-list-1792073991742.3096">
                <span class="icon">❤️</span>
              </div>
            </div>
          </div>
        </div>
        <div class="moment-item">
          <div class="moment-avatar"><img src="images/sunx.jpg" alt="小戴小戴"></div>
          <div class="moment-content">
            <div class="moment-name">小戴小戴</div>
            <div class="moment-text">十万字</div>
            <div class="moment-footer">
              <span>昨天</span>
              <span class="moment-like-btn" onclick="toggleLike(this, 'like-list-1792074019778.0723')">❤️ 赞</span>
            </div>
            <div class="moments-interaction">
              <div class="like-list" id="like-list-1792074019778.0723">
                <span class="icon">❤️</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const myAvatarUrl = 'images/dai.png';
  const myNickname = '黄沐之女';
  const chatData = {
    '天使母亲': {
      avatar: 'images/mucheng.png',
      messages: [
        { type: 'right', text: '111' },
        { type: 'time', text: '12：61' },
        { type: 'left', text: '❤️' }
      ]
    }
  };
  function switchTab(tabId, title) {
    document.querySelectorAll('.tab-view').forEach(tab => tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById('mainHeader').innerText = title;
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.currentTarget.classList.add('active');
    closeChat();
    closeMoments();
  }
  function openChat(name) {
    document.getElementById('chatTitle').innerText = name;
    const msgArea = document.getElementById('msgArea');
    msgArea.innerHTML = '';
    const data = chatData[name];
    if (!data) return;
    data.messages.forEach(msg => {
      if (msg.type === 'time') {
        const timeDiv = document.createElement('div');
        timeDiv.className = 'msg-time';
        timeDiv.innerText = msg.text;
        msgArea.appendChild(timeDiv);
        return;
      }
      const rowDiv = document.createElement('div');
      rowDiv.className = 'msg-row ' + msg.type;
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'msg-avatar';
      const img = document.createElement('img');
      img.src = msg.type === 'right' ? myAvatarUrl : data.avatar;
      avatarDiv.appendChild(img);
      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'msg ' + msg.type;
      bubbleDiv.innerText = msg.text;
      if (msg.type === 'left') {
        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(bubbleDiv);
      } else {
        rowDiv.appendChild(bubbleDiv);
        rowDiv.appendChild(avatarDiv);
      }
      msgArea.appendChild(rowDiv);
    });
    document.getElementById('chatDetail').classList.add('active');
    msgArea.scrollTop = msgArea.scrollHeight;
  }
  function closeChat() { document.getElementById('chatDetail').classList.remove('active'); }
  function openMoments() { document.getElementById('momentsView').classList.add('active'); }
  function closeMoments() { document.getElementById('momentsView').classList.remove('active'); }
  function toggleLike(btn, listId) {
    const list = document.getElementById(listId);
    const isLiked = btn.classList.contains('liked');
    if (!isLiked) {
      btn.classList.add('liked');
      btn.innerText = '❤️ 取消';
      const myName = document.createElement('span');
      myName.className = 'name liked-me';
      myName.innerText = myNickname;
      const existingNames = list.querySelectorAll('.name');
      if (existingNames.length > 0) {
        const sep = document.createElement('span');
        sep.innerText = '、';
        sep.className = 'liked-me-sep';
        list.appendChild(sep);
      }
      list.appendChild(myName);
    } else {
      btn.classList.remove('liked');
      btn.innerText = '❤️ 赞';
      const myName = list.querySelector('.liked-me');
      const sep = list.querySelector('.liked-me-sep');
      if (myName) myName.remove();
      if (sep) sep.remove();
    }
  }
</script>
</body>
</html>
