<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微信仿真界面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* 手机外壳 */
  .phone { width: 375px; height: 812px; background: #000; border-radius: 45px; border: 10px solid #2c2c2e; position: relative; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 30px; background: #000; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 1000; }
  .status-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 25px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #000; z-index: 999; }

  /* 微信 App 容器 */
  .wechat-app { width: 100%; height: 100%; background: #ededed; display: flex; flex-direction: column; position: absolute; top: 0; left: 0; }

  /* 顶部导航栏 */
  .nav-header { padding: 50px 15px 15px; background: #ededed; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 17px; position: relative; }
  .nav-header .back-btn { position: absolute; left: 15px; bottom: 15px; cursor: pointer; color: #000; font-size: 16px; display: flex; align-items: center; }
  .nav-header .back-btn::before { content: "‹"; font-size: 28px; margin-right: 2px; line-height: 1; }
  .nav-header .right-btn { position: absolute; right: 15px; bottom: 15px; cursor: pointer; color: #000; font-size: 18px; }

  /* 主视图区域 */
  .main-content { flex: 1; overflow-y: auto; position: relative; }

  /* 微信标签页 */
  .tab-view { display: none; height: 100%; overflow-y: auto; padding-bottom: 60px; }
  .tab-view.active { display: block; }

  /* 聊天列表项 */
  .chat-item { display: flex; align-items: center; padding: 15px; background: #fff; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .chat-item:active { background: #f0f0f0; }
  .chat-avatar { width: 48px; height: 48px; border-radius: 6px; background: #ccc; margin-right: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 18px; flex-shrink: 0; }
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-weight: 500; font-size: 16px; margin-bottom: 4px; color: #000; }
  .chat-msg { color: #888; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { display: flex; flex-direction: column; align-items: flex-end; }
  .chat-time { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  .chat-badge { background: #ff3b30; color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; justify-content: center; align-items: center; padding: 0 4px; }

  /* 通讯录列表项 */
  .contact-item { display: flex; align-items: center; padding: 15px; background: #fff; border-bottom: 1px solid #f0f0f0; }
  .contact-avatar { width: 40px; height: 40px; border-radius: 4px; background: #07c160; margin-right: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 16px; }

  /* 发现页列表 */
  .discover-item { display: flex; align-items: center; padding: 15px; background: #fff; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .discover-item:active { background: #f0f0f0; }
  .discover-icon { width: 30px; height: 30px; margin-right: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
  .discover-text { flex: 1; font-size: 16px; color: #000; }
  .discover-arrow { color: #ccc; font-size: 18px; }

  /* 底部导航栏 */
  .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #888; font-size: 10px; flex: 1; padding: 5px 0; }
  .nav-item.active { color: #07c160; }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }

  /* 聊天详情页 */
  .chat-detail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ededed; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 200; }
  .chat-detail.active { transform: translateX(0); }
  .chat-detail .nav-header { background: #ededed; }
  .msg-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 75%; padding: 10px 15px; border-radius: 6px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
  .msg.left { background: #fff; align-self: flex-start; margin-left: 10px; }
  .msg.left::before { content: ""; position: absolute; left: -6px; top: 12px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #fff; }
  .msg.right { background: #95ec69; align-self: flex-end; margin-right: 10px; }
  .msg.right::after { content: ""; position: absolute; right: -6px; top: 12px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 6px solid #95ec69; }
  .chat-input-area { padding: 10px 15px; background: #f7f7f7; border-top: 1px solid #ddd; }
  .chat-input-area input { width: 100%; padding: 10px 15px; border-radius: 6px; border: 1px solid #ddd; outline: none; font-size: 15px; }

  /* 朋友圈 */
  .moments-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; z-index: 300; }
  .moments-view.active { transform: translateX(0); }
  .moments-header { position: relative; height: 250px; background: linear-gradient(135deg, #667eea, #764ba2); }
  .moments-header .back-btn { position: absolute; top: 55px; left: 15px; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; z-index: 10; }
  .moments-header .back-btn::before { content: "‹"; font-size: 28px; margin-right: 2px; line-height: 1; }
  .moments-header .user-info { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; color: #fff; }
  .moments-header .user-info img { width: 60px; height: 60px; border-radius: 6px; border: 2px solid #fff; margin-left: 10px; object-fit: cover; }
  .moments-body { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
  
  .moment-item { display: flex; margin-bottom: 25px; }
  .moment-avatar { width: 40px; height: 40px; border-radius: 4px; background: #07c160; margin-right: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; flex-shrink: 0; }
  .moment-content { flex: 1; }
  .moment-name { color: #576b95; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .moment-text { font-size: 15px; color: #000; margin-bottom: 8px; line-height: 1.4; }
  .moment-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .moment-images img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; }
  .moment-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; }
  .moment-like-btn { cursor: pointer; color: #576b95; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

  <div class="wechat-app">
    
    <!-- ===== 主界面（消息、通讯录、发现、我） ===== -->
    <div class="nav-header" id="mainHeader">微信</div>
    <div class="main-content">
      <!-- 微信（消息列表） -->
      <div class="tab-view active" id="tab-chats">
        <div class="chat-item" onclick="openChat('张佳乐')">
          <div class="chat-avatar" style="background:#07c160;">张</div>
          <div class="chat-info">
            <div class="chat-name">张佳乐</div>
            <div class="chat-msg">今晚出嚟饮嘢？</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">刚刚</div>
            <div class="chat-badge">2</div>
          </div>
        </div>
        <div class="chat-item" onclick="openChat('Kakao Friend')">
          <div class="chat-avatar" style="background:#e74c3c;">K</div>
          <div class="chat-info">
            <div class="chat-name">Kakao Friend</div>
            <div class="chat-msg">好的，老地方见。</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">昨天</div>
          </div>
        </div>
        <div class="chat-item" onclick="openChat('订阅号消息')">
          <div class="chat-avatar" style="background:#3498db;">📰</div>
          <div class="chat-info">
            <div class="chat-name">订阅号消息</div>
            <div class="chat-msg">你关注的公众号更新了</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">昨天</div>
          </div>
        </div>
      </div>

      <!-- 通讯录 -->
      <div class="tab-view" id="tab-contacts">
        <div class="contact-item"><div class="contact-avatar">张</div> 张佳乐</div>
        <div class="contact-item"><div class="contact-avatar" style="background:#e74c3c;">K</div> Kakao Friend</div>
        <div class="contact-item"><div class="contact-avatar" style="background:#3498db;">李</div> 李小明</div>
        <div class="contact-item"><div class="contact-avatar" style="background:#9b59b6;">王</div> 王大明</div>
      </div>

      <!-- 发现 -->
      <div class="tab-view" id="tab-discover">
        <div class="discover-item" onclick="openMoments()">
          <div class="discover-icon">📷</div>
          <div class="discover-text">朋友圈</div>
          <div class="discover-arrow">›</div>
        </div>
        <div class="discover-item">
          <div class="discover-icon">📺</div>
          <div class="discover-text">视频号</div>
          <div class="discover-arrow">›</div>
        </div>
        <div class="discover-item">
          <div class="discover-icon">🔍</div>
          <div class="discover-text">扫一扫</div>
          <div class="discover-arrow">›</div>
        </div>
      </div>

      <!-- 我 -->
      <div class="tab-view" id="tab-me">
        <div style="padding: 30px; text-align: center; background: #fff;">
          <div style="width: 70px; height: 70px; border-radius: 8px; background: #07c160; margin: 0 auto 10px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 28px; font-weight: bold;">我</div>
          <div style="font-weight: bold; font-size: 18px;">我的微信昵称</div>
          <div style="color: #888; font-size: 13px; margin-top: 5px;">微信号：my_wechat_id</div>
        </div>
        <div class="discover-item"><div class="discover-icon">⭐</div><div class="discover-text">收藏</div><div class="discover-arrow">›</div></div>
        <div class="discover-item"><div class="discover-icon">🖼️</div><div class="discover-text">相册</div><div class="discover-arrow">›</div></div>
        <div class="discover-item"><div class="discover-icon">⚙️</div><div class="discover-text">设置</div><div class="discover-arrow">›</div></div>
      </div>
    </div>

    <!-- ===== 底部导航栏 ===== -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-chats', '微信')">
        <span class="nav-icon">💬</span>微信
      </div>
      <div class="nav-item" onclick="switchTab('tab-contacts', '通讯录')">
        <span class="nav-icon">👥</span>通讯录
      </div>
      <div class="nav-item" onclick="switchTab('tab-discover', '发现')">
        <span class="nav-icon">🧭</span>发现
      </div>
      <div class="nav-item" onclick="switchTab('tab-me', '我')">
        <span class="nav-icon">👤</span>我
      </div>
    </div>

    <!-- ===== 聊天详情页 ===== -->
    <div class="chat-detail" id="chatDetail">
      <div class="nav-header">
        <div class="back-btn" onclick="closeChat()">返回</div>
        <span id="chatTitle">聊天</span>
      </div>
      <div class="msg-area" id="msgArea">
        <!-- 聊天记录会通过 JS 动态生成 -->
      </div>
      <div class="chat-input-area">
        <input type="text" placeholder="输入消息...">
      </div>
    </div>

    <!-- ===== 朋友圈页面 ===== -->
    <div class="moments-view" id="momentsView">
      <div class="moments-header">
        <div class="back-btn" onclick="closeMoments()">返回</div>
        <div class="user-info">
          <span>我的昵称</span>
          <img src="https://picsum.photos/100/100?random=99" alt="头像">
        </div>
      </div>
      <div class="moments-body">
        <!-- 朋友圈动态 -->
        <div class="moment-item">
          <div class="moment-avatar">张</div>
          <div class="moment-content">
            <div class="moment-name">张佳乐</div>
            <div class="moment-text">今天的排练很顺利，晚上吃顿好的！🍜</div>
            <div class="moment-images">
              <img src="https://picsum.photos/200/200?random=1" alt="">
              <img src="https://picsum.photos/200/200?random=2" alt="">
              <img src="https://picsum.photos/200/200?random=3" alt="">
            </div>
            <div class="moment-footer">
              <span>刚刚</span>
              <span class="moment-like-btn">❤️ 赞</span>
            </div>
          </div>
        </div>
        <div class="moment-item">
          <div class="moment-avatar" style="background:#e74c3c;">K</div>
          <div class="moment-content">
            <div class="moment-name">Kakao Friend</div>
            <div class="moment-text">新买的相机到货了，试拍了几张！📸</div>
            <div class="moment-images">
              <img src="https://picsum.photos/200/200?random=4" alt="">
              <img src="https://picsum.photos/200/200?random=5" alt="">
            </div>
            <div class="moment-footer">
              <span>昨天</span>
              <span class="moment-like-btn">❤️ 赞</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // ===== 页面切换逻辑 =====

  // 切换底部标签页
  function switchTab(tabId, title) {
    // 隐藏所有标签页
    document.querySelectorAll('.tab-view').forEach(tab => tab.classList.remove('active'));
    // 显示目标标签页
    document.getElementById(tabId).classList.add('active');
    // 更新顶部标题
    document.getElementById('mainHeader').innerText = title;
    // 更新底部导航高亮
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    event.currentTarget.classList.add('active');
    // 关闭子页面（以防万一）
    closeChat();
    closeMoments();
  }

  // 打开聊天详情
  function openChat(name) {
    document.getElementById('chatTitle').innerText = name;
    
    // 动态生成聊天记录（模拟数据）
    const msgArea = document.getElementById('msgArea');
    msgArea.innerHTML = '';
    
    const chatData = {
      '张佳乐': [
        { type: 'left', text: '今晚出嚟饮嘢？' },
        { type: 'right', text: '好啊，老地方见。' },
        { type: 'left', text: '记得带埋你嗰个新剧本。' },
        { type: 'right', text: '冇问题，我已经放咗入袋。' }
      ],
      'Kakao Friend': [
        { type: 'left', text: '안녕하세요! (你好！)' },
        { type: 'right', text: '你好！有什么可以帮到你？' },
        { type: 'left', text: '今晚一起吃饭吗？' }
      ],
      '订阅号消息': [
        { type: 'left', text: '你关注的公众号更新了3篇文章，点击查看详情。' }
      ]
    };

    const messages = chatData[name] || [{ type: 'left', text: '你好！' }];
    
    messages.forEach(msg => {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${msg.type}`;
      msgDiv.innerText = msg.text;
      msgArea.appendChild(msgDiv);
    });

    // 显示聊天详情页
    document.getElementById('chatDetail').classList.add('active');
    // 滚动到底部
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  // 关闭聊天详情
  function closeChat() {
    document.getElementById('chatDetail').classList.remove('active');
  }

  // 打开朋友圈
  function openMoments() {
    document.getElementById('momentsView').classList.add('active');
  }

  // 关闭朋友圈
  function closeMoments() {
    document.getElementById('momentsView').classList.remove('active');
  }

  // 监听浏览器返回键（可选，方便测试）
  window.addEventListener('popstate', function() {
    closeChat();
    closeMoments();
  });
</script>
</body>
</html>
